<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Hearth Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#6c5ce7">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="favicon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hearth Chat">
  <meta name="mobile-web-app-capable" content="yes">
  <script>
    window.__pwaInstallPrompt = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.__pwaInstallPrompt = e;
    });
  </script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <a class="brand" href="index.html">
        <span class="logo"><i class="fa-solid fa-heart"></i></span>
        <span>Hearth <em>Chat</em></span>
      </a>
      <h1>Create your account</h1>
      <p class="sub">Join a community where you'll always get a reply.</p>
      <div class="form-error" id="form-error"></div>
      <form id="signup-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" type="text" placeholder="e.g. calmwanderer" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="fullName">Full Names</label>
          <input class="input" id="fullName" type="text" placeholder="e.g. Jordan Smith" required>
        </div>
        <div class="row2">
          <div class="field">
            <label for="age">Age</label>
            <input class="input" id="age" type="number" min="13" max="120" placeholder="21" required>
          </div>
          <div class="field">
            <label for="gender">Gender</label>
            <select class="select" id="gender" required>
              <option value="" disabled selected>Choose</option>
              <option>Female</option>
              <option>Male</option>
              <option>Non-binary</option>
              <option>Prefer not to say</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pass-wrap">
            <input class="input" id="password" type="password" placeholder="Min. 6 characters" minlength="6" autocomplete="new-password" required>
            <button class="pass-toggle" type="button" id="password-toggle" aria-label="Show password" tabindex="-1">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <button class="btn btn-success btn-block" type="submit" id="signup-submit" style="padding:13px;font-size:15px">Create Account</button>
      </form>
      <div id="signup-done" class="hidden" style="text-align:center;padding:8px 0">
        <div class="big" style="color:var(--success);margin-bottom:10px"><i class="fa-solid fa-envelope-circle-check"></i></div>
        <h1 style="font-size:22px">Check your email</h1>
        <p class="muted" style="font-size:14px;line-height:1.55;margin:10px 0 4px">We sent a confirmation link to<br><b id="signup-done-email"></b>.</p>
        <p class="muted" style="font-size:13px;line-height:1.5">Tap it to verify your email and finish creating your account. If you don't see it, check your spam folder.</p>
      </div>
      <p class="auth-alt">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="db.js"></script>
  <script>
    const errBox = document.getElementById('form-error');
    const submitBtn = document.getElementById('signup-submit');
    const showErr = (m) => { errBox.textContent = m; errBox.classList.add('show'); };

    function toast(msg, type) {
      const wrap = document.getElementById('toasts');
      const t = document.createElement('div');
      t.className = 'toast' + (type ? ' ' + type : '');
      t.textContent = msg;
      wrap.appendChild(t);
      setTimeout(() => { t.remove(); }, 3200);
    }

    const passInput = document.getElementById('password');
    const passToggle = document.getElementById('password-toggle');
    passToggle.addEventListener('click', () => {
      const showing = passInput.type === 'text';
      passInput.type = showing ? 'password' : 'text';
      passToggle.innerHTML = showing ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
      passToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });

    window.addEventListener('pageshow', () => {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
    });

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');

      const username = document.getElementById('username').value.trim();
      const fullName = document.getElementById('fullName').value.trim();
      const age = parseInt(document.getElementById('age').value, 10);
      const gender = document.getElementById('gender').value;
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      const fail = (m) => { showErr(m); toast(m, 'error'); submitBtn.disabled = false; submitBtn.textContent = 'Create Account'; };
      if (username.length < 3) return fail('Username must be at least 3 characters.');
      if (fullName.length < 3) return fail('Please enter your full names.');
      if (!age || age < 13 || age > 120) return fail('Please enter a valid age (13+).');
      if (!gender) return fail('Please select your gender.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail('Please enter a valid email address.');
      if (password.length < 6) return fail('Password must be at least 6 characters.');

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner"></i> Creating account...';

      await LC.db.init(['users', 'profiles']);
      const isAdminEmail = email === LC.config.adminDefault.email;
      const userMatch = LC.db.users.byUsername(username);
      const emailMatch = LC.db.users.byEmail(email);
      const profMatch = LC.db.profiles.get().find(p => p.username.toLowerCase() === username.toLowerCase());
      if (isAdminEmail) {
        // The seeded admin row already exists — allow the real owner to register
        // their email so they can sign in with Supabase Auth.
        if (profMatch) return fail('That username is already taken.');
      } else {
        if (userMatch || profMatch) return fail('That username is already taken.');
        if (emailMatch) return fail('That email is already registered.');
      }

      const confirmUrl = location.origin + location.pathname.replace(/[^/]*$/, '') + 'confirm.html';

      let result;
      try {
        result = await LC.supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: { username, fullName, age, gender },
            emailRedirectTo: confirmUrl
          }
        });
      } catch (err) {
        return fail(err.message || 'Something went wrong. Please try again.');
      }

      const authErr = result && result.error;
      if (authErr) {
        return fail(authErr.message === 'User already registered'
          ? 'That email is already registered. Try logging in instead.'
          : (authErr.message || 'Something went wrong. Please try again.'));
      }

      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';

      if (result.data && result.data.session) {
        // Email confirmation is off in this project — treat as verified.
        await LC.auth.restoreSession();
        toast('Account created — welcome, ' + username + '!', 'ok');
        setTimeout(() => { window.location.href = 'app.html'; }, 300);
        return;
      }

      // Email confirmation is required — tell the user to check their inbox.
      document.getElementById('signup-done-email').textContent = email;
      document.getElementById('signup-done').classList.remove('hidden');
      document.getElementById('signup-form').classList.add('hidden');
      toast('Confirmation email sent — check your inbox!', 'ok');
    });
  </script>
  <script src="pwa.js" defer></script>
</body>
</html>
